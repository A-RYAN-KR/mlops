name: Telco Churn CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync

    - name: Lint and Format checking (Ruff)
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run Unit Tests
      run: |
        uv run pytest

    - name: Verify Docker Container Build
      run: |
        docker build -t telco-churn-api -f Dockerfile .
