[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Telco Customer Churn prediction with MLOps pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc[s3]>=3.52.0",
    "boto3>=1.34.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mlflow>=2.11.0",
    "psycopg2-binary>=2.9.9",
    "feast>=0.37.0",
    "pyarrow>=15.0.0",
    "evidently>=0.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prefect>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]
